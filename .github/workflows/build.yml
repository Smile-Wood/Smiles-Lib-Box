# Builds every Stonecutter node of the library, one job per game version.
# The library ships one jar per game version, so a single-node build would hide
# breakage in the other seven adapters.
#
# 主线分支上不跑这个：publish.yml 会把八个节点一次性构建并发布，重复构建没有意义。
# 这里只看 PR 与功能分支，一个节点一个 job，坏在哪个版本 PR 上就能看出来。

name: build
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['1.20.1', '1.20.4', '1.20.6', '1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.11']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.node }}
        run: ./gradlew :${{ matrix.node }}:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error
